name: Publish map
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petrol-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix traffic-service --ignore-scripts --no-audit --no-fund
      - name: Check application, catalogue and traffic security
        run: |
          node --check dist/app.js
          node --check dist/core.js
          node --check dist/live.js
          node --check dist/owner-session.js
          node --test tests/*.test.cjs traffic-service/*.test.mjs
          python -m unittest discover -s scripts -p 'test_archive_traffic.py'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
